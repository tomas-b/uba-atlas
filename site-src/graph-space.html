function inspect(a){chosen=a;if(autoUnfold)unfold(a);const m=meta[a],cs=m.counts||{},src=m.source||meta[m.referenceParent||par(a)]?.source;let url=null;try{const u=new URL(src?.url);if(/^https?:$/.test(u.protocol))url=u.href}catch{}$('inspector').innerHTML=`<button class="close" aria-label="Cerrar detalle">×</button><p class="kind">${esc(kinds[m.k]||m.k)}${m.g?' · '+esc(m.g):''}${m.v?' · ◇ Auditoría':''}</p><h2>${esc(name(a))}</h2><p>${esc(m.role||m.description||'')}</p><p>${m.s?'Nodo sellado.':m.d?'Contenido disponible en una página propia.':'Referencia citada en el índice de su nodo padre.'}</p><div class="stats"><div><b>${fmt(cs.courses)}</b><small>materias</small></div><div><b>${fmt(cs.units)}</b><small>unidades</small></div><div><b>${fmt(cs.books)}</b><small>libros</small></div></div><button class="fly">Viajar a este nodo ↗</button>${children[a]?.length?'<button class="unfold">Desplegar esta rama</button>':''}${m.d?`<a target="_blank" rel="noopener" href="index.html#${encodeURIComponent(a)}">Abrir contenido y auditoría ↗</a>`:''}${url?`<a target="_blank" rel="noopener" href="${esc(url)}">${m.source?'Fuente del nodo':'Fuente del nodo que cita esta entrada'}: ${esc(src.label||'documento')} ↗</a>`:''}${children[a]?.length?`<div class="children">${children[a].map(c=>`<button data-a="${esc(c)}">${esc(name(c))} →</button>`).join('')}</div>`:''}`;$('inspector').hidden=false;$('inspector').querySelector('.close').onclick=clearSelection;$('inspector').querySelector('.fly').onclick=()=>travel(a);const unfoldButton=$('inspector').querySelector('.unfold');if(unfoldButton)unfoldButton.onclick=()=>toggleBranch(a);updateUnfoldButton();$('inspector').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>inspect(b.dataset.a));emphasize()}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
function pick(event){const r=renderer.domElement.getBoundingClientRect();pointer.set((event.clientX-r.left)/r.width*2-1,-(event.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObject(nodes,false)[0];if(hit)return ids[hit.instanceId];if(lines.visible){raycaster.params.Line.threshold=Math.max(.3,Math.min(2,camera.position.distanceTo(controls.target)*.002));const edge=raycaster.intersectObject(lines,false)[0];if(edge)return edgeIds[Math.floor(edge.index/2)]}return null}
function invalidate(){if(!frame)frame=requestAnimationFrame(tick)}
function tick(now){frame=0;if(flight){const t=flight.duration?Math.min(1,(now-flight.start)/flight.duration):1,e=t*t*(3-2*t);camera.position.lerpVectors(flight.from,flight.to,e);controls.target.lerpVectors(flight.oldTarget,flight.target,e);if(t===1)flight=null}controls.update();if(ready)syncSpatialGeometry(now);renderer.render(scene,camera);drawLabels();if(flight||morph)invalidate()}
function resize(){const w=$('world').clientWidth,h=$('world').clientHeight;lens.radius=Math.min(140,w*.4);$('lens-ring').style.width=lens.radius*2+'px';$('lens-ring').style.height=lens.radius*2+'px';renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();invalidate()}
function theme(){scene.background=new THREE.Color(dark.matches?'#0f161d':'#ecebe5');lines.material.opacity=dark.matches ? .13 : .23;updateGeometry()}
async function init(){try{const response=await fetch('graph-data.json');if(!response.ok)throw Error('No se pudo cargar el índice.');const data=await response.json();meta=data.meta;ids=Object.keys(meta).sort((a,b)=>a.split('.').length-b.split('.').length||a.localeCompare(b));ids.forEach((a,i)=>{index[a]=i;if(par(a))(children[par(a)]??=[]).push(a)});faculties=children.uba;layout=new URLSearchParams(location.search).get('layout')==='strata'?'strata':'constellation';$('layout').value=layout;
 scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(45,1,.1,12000);camera.position.set(850,650,1000);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('world').prepend(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.minDistance=4;controls.maxDistance=5000;controls.enableDamping=false;controls.addEventListener('change',invalidate);controls.addEventListener('start',()=>{flight=null;$('hover').hidden=true});
 nodes=new THREE.InstancedMesh(new THREE.SphereGeometry(1,8,6),fadeMaterial(new THREE.MeshBasicMaterial({transparent:true,depthWrite:false})),ids.length);nodes.geometry.setAttribute('focusOpacity',new THREE.InstancedBufferAttribute(new Float32Array(ids.length).fill(1),1));scene.add(nodes);lines=new THREE.LineSegments(new THREE.BufferGeometry(),fadeMaterial(new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.13,depthWrite:false})));scene.add(lines);highlight=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:'#dcad66',transparent:true,opacity:.9,depthTest:false}));highlight.renderOrder=2;scene.add(highlight);highlight.frustumCulled=false;lines.frustumCulled=false;tethers=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:'#b29c77',transparent:true,opacity:.12,depthWrite:false}));tethers.frustumCulled=false;scene.add(tethers);resize();theme();new ResizeObserver(resize).observe($('world'));dark.addEventListener('change',theme);
 renderer.domElement.addEventListener('pointerdown',e=>{pointerStart={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('click',e=>{if(pointerStart&&Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)>5)return;const a=pick(e);if(a)inspect(a);else clearSelection()});renderer.domElement.addEventListener('dblclick',e=>{const a=pick(e);if(a)travel(a)});renderer.domElement.addEventListener('pointerleave',()=>{$('hover').hidden=true;lens.inside=false;invalidate()});let hoverTime=0;renderer.domElement.addEventListener('pointermove',e=>{if(lens.enabled){const rect=renderer.domElement.getBoundingClientRect();lens.x=e.clientX-rect.left;lens.y=e.clientY-rect.top;lens.inside=true;invalidate()}if(e.buttons||performance.now()-hoverTime<80)return;hoverTime=performance.now();const a=pick(e);$('hover').hidden=!a;renderer.domElement.style.cursor=a?'pointer':'grab';if(a){$('hover').textContent=name(a);$('hover').style.left=Math.max(4,Math.min(e.clientX+12,$('world').clientWidth-270))+'px';$('hover').style.top=Math.max(4,e.clientY-$('world').getBoundingClientRect().top-35)+'px'}});
 renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();$('error').hidden=false;$('error').innerHTML='Se perdió la conexión gráfica. <button onclick="location.reload()">Recargar</button>'});ready=true;$('error').hidden=true;let a;try{a=decodeURIComponent(location.hash.slice(1))}catch{}travel(meta[a]?a:'uba',false);
 }catch(e){$('error').innerHTML=`${esc(e.message)}<br>Esta vista necesita WebGL.<br><a href="graph.html">Volver al Atlas 2D →</a>`;console.error(e)}}
$('unfold-auto').onclick=()=>{autoUnfold=!autoUnfold;$('unfold-auto').setAttribute('aria-pressed',autoUnfold)};$('fold-all').onclick=()=>{if(ready){expanded.clear();animateExpansion()}};$('lens-toggle').onclick=()=>{if(ready)setLens(!lens.enabled)};
$('reset').onclick=()=>{if(ready)travel('uba')};$('top').onclick=()=>{if(ready)flyTo(controls.target,camera.position.distanceTo(controls.target),new THREE.Vector3(0,1,.001))};$('orbit').onclick=()=>{if(ready)flyTo(controls.target,camera.position.distanceTo(controls.target),new THREE.Vector3(1,.65,1).normalize())};$('edges').onclick=()=>{if(!ready)return;lines.visible=!lines.visible;$('edges').setAttribute('aria-pressed',lines.visible);invalidate()};$('layout').onchange=e=>{if(!ready)return;layout=e.target.value;updateGeometry();travel(active)};
$('search').oninput=()=>{if(!ready)return;const q=normalize($('search').value.trim());if(!q){$('results').hidden=true;return}const matches=ids.filter(a=>normalize(name(a)+' '+a).includes(q)).slice(0,25);$('results').innerHTML=matches.length?matches.map(a=>`<button data-a="${esc(a)}">${esc(name(a))}<small>${esc(kinds[meta[a].k]||meta[a].k)} · ${esc(name(par(a))||'UBA')}</small></button>`).join(''):'<p style="padding:12px">Sin coincidencias.</p>';$('results').hidden=false;$('results').querySelectorAll('button').forEach(b=>b.onclick=()=>{travel(b.dataset.a);inspect(b.dataset.a);$('results').hidden=true;$('search').value=''})};$('search').onkeydown=e=>{if(e.key==='Enter')$('results').querySelector('button')?.click();if(e.key==='ArrowDown'){$('results').querySelector('button')?.focus();e.preventDefault()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ready){clearSelection();setLens(false)};$('results').hidden=true}});document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('results').hidden=true});window.addEventListener('popstate',()=>{if(!ready)return;layout=new URLSearchParams(location.search).get('layout')==='strata'?'strata':'constellation';$('layout').value=layout;updateGeometry();let a;try{a=decodeURIComponent(location.hash.slice(1))}catch{}travel(meta[a]?a:'uba',false)});init();
