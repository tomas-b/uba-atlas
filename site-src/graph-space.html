<body>
<header><a class="brand" href="index.html">UBA <span>Atlas</span></a><span class="title">04 / Constelación</span><a id="back" href="graph.html">← Atlas 2D</a><div class="search"><input id="search" type="search" placeholder="Encontrar un nodo…" aria-label="Buscar en toda la constelación" autocomplete="off" aria-controls="results"><div id="results" hidden></div></div></header>
<main id="world"><div class="hud"><div class="crumb" id="crumb"></div><h1 id="heading">Una universidad, en órbita.</h1><p id="summary">Cargando el índice completo…</p></div><div id="labels"></div><aside id="inspector" class="inspector" hidden aria-label="Detalle del nodo"></aside><div id="hover" hidden></div><div class="key"><span>●</span> Color: facultad · tamaño: tipo de nodo · conexiones: pertenencia</div><div class="toolbar"><button id="reset">↖ Toda la UBA</button><button id="top">Desde arriba</button><button id="orbit">Perspectiva</button><button id="edges" aria-pressed="true">Conexiones</button><label><select id="layout" aria-label="Distribución espacial"><option value="constellation">Constelación</option><option value="strata">Estratos</option></select></label><span class="instructions">Arrastrar: orbitar · rueda: acercar · clic: detalle · doble clic: viajar</span></div><div id="error">Preparando la constelación…</div></main>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from './vendor/OrbitControls.js';
const $=id=>document.getElementById(id),fmt=n=>Number(n||0).toLocaleString('es-AR');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const palette=['#c49c54','#c68773','#99ad64','#81af93','#baa768','#77b5c6','#b8b67b','#c392bd','#87afd6','#c59082','#85b7a6','#d19096','#c0a076','#a5a2d3'];
const kinds={institution:'Institución',faculty:'Facultad',cbc:'CBC',cbcarea:'Área CBC',career:'Carrera',course:'Materia',unit:'Unidad',book:'Libro'};
let meta={},ids=[],index={},children={},faculties=[],positions={},edgeIds=[],scene,camera,renderer,controls,nodes,lines,highlight,flight=null,active='uba',chosen=null,layout='constellation',frame=0,ready=false,labels=[],pointerStart=null;
const dark=matchMedia('(prefers-color-scheme:dark)'),reduced=matchMedia('(prefers-reduced-motion:reduce)');
const par=a=>meta[a]?.p;const name=a=>meta[a]?.l||a;const normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function branch(a){return ids.filter(b=>b===a||b.startsWith(a+'.'))}
function nodeColor(a){if(a==='uba')return new THREE.Color(dark.matches?'#efe6d3':'#584c39');return new THREE.Color(meta[a].s?'#dd725d':palette[Math.max(0,faculties.indexOf(meta[a].f))%palette.length])}
function radius(a){return ({institution:7,faculty:4.7,cbc:4.7,career:2.5,cbcarea:2.5,course:1.05,unit:.6,book:.6}[meta[a].k]||1)*(meta[a].d?1.15:1)}
// Deterministic nested spheres. Position describes hierarchy, never similarity.
function positionBranch(a,center,spread,level){positions[a]=center;const cs=children[a]||[];cs.forEach((c,i)=>{const count=cs.length,phi=i*Math.PI*(3-Math.sqrt(5)),y=count===1?0:1-2*(i+.5)/count,r=Math.sqrt(1-y*y);let offset=new THREE.Vector3(Math.cos(phi)*r,y,Math.sin(phi)*r).multiplyScalar(spread);if(layout==='strata'){const angle=2*Math.PI*i/count;offset.set(Math.cos(angle)*spread,-Math.max(25,105-level*15),Math.sin(angle)*spread)}positionBranch(c,center.clone().add(offset),Math.max(1.5,spread*.24),level+1)})}
function computePositions(){positions={};positionBranch('uba',new THREE.Vector3(),340,0)}
function replaceGeometry(object,geometry){object.geometry.dispose();object.geometry=geometry}
function updateGeometry(){computePositions();const dummy=new THREE.Object3D();ids.forEach((a,i)=>{dummy.position.copy(positions[a]);dummy.scale.setScalar(radius(a));dummy.updateMatrix();nodes.setMatrixAt(i,dummy.matrix);nodes.setColorAt(i,nodeColor(a))});nodes.instanceMatrix.needsUpdate=true;nodes.instanceColor.needsUpdate=true;nodes.computeBoundingSphere();const pts=[],colors=[];edgeIds=[];for(const a of ids){const p=par(a);if(!positions[p])continue;edgeIds.push(a);pts.push(...positions[p].toArray(),...positions[a].toArray());const c=nodeColor(a);colors.push(c.r,c.g,c.b,c.r,c.g,c.b)}const geometry=new THREE.BufferGeometry();geometry.setAttribute('position',new THREE.Float32BufferAttribute(pts,3));geometry.setAttribute('color',new THREE.Float32BufferAttribute(colors,3));geometry.setAttribute('focusOpacity',new THREE.Float32BufferAttribute(new Float32Array(edgeIds.length*2).fill(1),1));replaceGeometry(lines,geometry);emphasize();setLabels();invalidate()}
function inSelectedBranch(a){return !chosen||chosen==='uba'||a===chosen||a.startsWith(chosen+'.')||chosen.startsWith(a+'.')}
function fadeMaterial(material){
 material.onBeforeCompile=shader=>{
  shader.vertexShader=shader.vertexShader.replace('#include <common>','#include <common>\nattribute float focusOpacity;\nvarying float vFocusOpacity;').replace('#include <begin_vertex>','#include <begin_vertex>\nvFocusOpacity = focusOpacity;');
  shader.fragmentShader=shader.fragmentShader.replace('#include <common>','#include <common>\nvarying float vFocusOpacity;').replace('#include <color_fragment>','#include <color_fragment>\ndiffuseColor.a *= vFocusOpacity;');
 };
 material.customProgramCacheKey=()=> 'atlas-branch-opacity';
 return material;
}
function clearSelection(){chosen=null;$('inspector').hidden=true;emphasize()}
function emphasize(){
 const pts=[];
 if(chosen){let a=chosen;while(par(a)){pts.push(...positions[a].toArray(),...positions[par(a)].toArray());a=par(a)}for(const c of children[chosen]||[])pts.push(...positions[chosen].toArray(),...positions[c].toArray())}
 const nodeAlpha=nodes.geometry.getAttribute('focusOpacity');ids.forEach((a,i)=>nodeAlpha.setX(i,inSelectedBranch(a)?1:.6));nodeAlpha.needsUpdate=true;
 const edgeAlpha=lines.geometry.getAttribute('focusOpacity');edgeIds.forEach((a,i)=>{const opacity=inSelectedBranch(a)?1:.6;edgeAlpha.setX(i*2,opacity);edgeAlpha.setX(i*2+1,opacity)});edgeAlpha.needsUpdate=true;
 for(const {a,el} of labels)el.style.opacity=inSelectedBranch(a)?'1':'.6';
 replaceGeometry(highlight,new THREE.BufferGeometry().setAttribute('position',new THREE.Float32BufferAttribute(pts,3)));invalidate();
}
function setLabels(){const addresses=active==='uba'?faculties:[active,...(children[active]||[]).slice(0,70)];$('labels').innerHTML='';labels=addresses.map(a=>{const el=document.createElement('button');el.className='label';el.style.opacity=inSelectedBranch(a)?'1':'.6';el.textContent=name(a);el.setAttribute('aria-label','Explorar '+name(a));el.style.borderColor=nodeColor(a).getStyle();el.onclick=()=>travel(a);$('labels').appendChild(el);return {a,el}})}
function drawLabels(){const w=$('world').clientWidth,h=$('world').clientHeight,occupied=[];for(const {a,el} of labels){const p=positions[a].clone().project(camera);if(p.z< -1||p.z>1||Math.abs(p.x)>1.1||Math.abs(p.y)>1.1){el.hidden=true;continue}const x=(p.x*.5+.5)*w,y=(-p.y*.5+.5)*h-15,width=Math.min(220,name(a).length*6+15);const box={x:x-width/2,y:y-10,w:width,h:22};if(occupied.some(b=>box.x<b.x+b.w&&box.x+box.w>b.x&&box.y<b.y+b.h&&box.y+box.h>b.y)){el.hidden=true;continue}occupied.push(box);el.hidden=false;el.style.left=x+'px';el.style.top=y+'px'}}
function bounds(a){const box=new THREE.Box3();for(const b of branch(a))box.expandByPoint(positions[b]);const sphere=box.getBoundingSphere(new THREE.Sphere());sphere.radius=Math.max(8,sphere.radius);return sphere}
function flyTo(target,distance,direction){const dir=direction||camera.position.clone().sub(controls.target).normalize();flight={start:performance.now(),from:camera.position.clone(),to:target.clone().add(dir.multiplyScalar(distance)),oldTarget:controls.target.clone(),target:target.clone(),duration:reduced.matches?0:850};invalidate()}
function travel(a,write=true){if(!meta[a])return;active=a;chosen=a;const b=bounds(a);const halfFov=THREE.MathUtils.degToRad(camera.fov/2),horizontal=Math.atan(Math.tan(halfFov)*camera.aspect),dist=b.radius/Math.sin(Math.min(halfFov,horizontal))*1.22;flyTo(b.center,Math.max(24,dist));$('heading').textContent=a==='uba'?'Una universidad, en órbita.':name(a);$('summary').textContent=fmt(branch(a).length)+' nodos en esta rama · '+fmt(ids.length)+' en el espacio';let chain=[],c=a;while(c){chain.unshift(c);c=par(c)}$('crumb').innerHTML=chain.map(c=>`<button data-a="${esc(c)}">${esc(c==='uba'?'UBA':name(c))}</button>`).join('<span>/</span>');$('crumb').querySelectorAll('button').forEach(b=>b.onclick=()=>travel(b.dataset.a));$('back').href='graph.html#'+encodeURIComponent(a);$('inspector').hidden=true;setLabels();emphasize();if(write){const u=new URL(location.href);u.hash=a;u.searchParams.set('layout',layout);history.pushState(null,'',u)}}
function inspect(a){chosen=a;const m=meta[a],cs=m.counts||{},src=m.source||meta[m.referenceParent||par(a)]?.source;let url=null;try{const u=new URL(src?.url);if(/^https?:$/.test(u.protocol))url=u.href}catch{}$('inspector').innerHTML=`<button class="close" aria-label="Cerrar detalle">×</button><p class="kind">${esc(kinds[m.k]||m.k)}${m.g?' · '+esc(m.g):''}${m.v?' · ◇ Auditoría':''}</p><h2>${esc(name(a))}</h2><p>${esc(m.role||m.description||'')}</p><p>${m.s?'Nodo sellado.':m.d?'Contenido disponible en una página propia.':'Referencia citada en el índice de su nodo padre.'}</p><div class="stats"><div><b>${fmt(cs.courses)}</b><small>materias</small></div><div><b>${fmt(cs.units)}</b><small>unidades</small></div><div><b>${fmt(cs.books)}</b><small>libros</small></div></div><button class="fly">Viajar a este nodo ↗</button>${m.d?`<a target="_blank" rel="noopener" href="index.html#${encodeURIComponent(a)}">Abrir contenido y auditoría ↗</a>`:''}${url?`<a target="_blank" rel="noopener" href="${esc(url)}">${m.source?'Fuente del nodo':'Fuente del nodo que cita esta entrada'}: ${esc(src.label||'documento')} ↗</a>`:''}${children[a]?.length?`<div class="children">${children[a].map(c=>`<button data-a="${esc(c)}">${esc(name(c))} →</button>`).join('')}</div>`:''}`;$('inspector').hidden=false;$('inspector').querySelector('.close').onclick=clearSelection;$('inspector').querySelector('.fly').onclick=()=>travel(a);$('inspector').querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>inspect(b.dataset.a));emphasize()}
const raycaster=new THREE.Raycaster(),pointer=new THREE.Vector2();
function pick(event){const r=renderer.domElement.getBoundingClientRect();pointer.set((event.clientX-r.left)/r.width*2-1,-(event.clientY-r.top)/r.height*2+1);raycaster.setFromCamera(pointer,camera);const hit=raycaster.intersectObject(nodes,false)[0];if(hit)return ids[hit.instanceId];if(lines.visible){raycaster.params.Line.threshold=Math.max(.3,Math.min(2,camera.position.distanceTo(controls.target)*.002));const edge=raycaster.intersectObject(lines,false)[0];if(edge)return edgeIds[Math.floor(edge.index/2)]}return null}
function invalidate(){if(!frame)frame=requestAnimationFrame(tick)}
function tick(now){frame=0;if(flight){const t=flight.duration?Math.min(1,(now-flight.start)/flight.duration):1,e=t*t*(3-2*t);camera.position.lerpVectors(flight.from,flight.to,e);controls.target.lerpVectors(flight.oldTarget,flight.target,e);if(t===1)flight=null}controls.update();renderer.render(scene,camera);drawLabels();if(flight)invalidate()}
function resize(){const w=$('world').clientWidth,h=$('world').clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();invalidate()}
function theme(){scene.background=new THREE.Color(dark.matches?'#0f161d':'#ecebe5');lines.material.opacity=dark.matches ? .13 : .23;updateGeometry()}
async function init(){try{const response=await fetch('graph-data.json');if(!response.ok)throw Error('No se pudo cargar el índice.');const data=await response.json();meta=data.meta;ids=Object.keys(meta).sort((a,b)=>a.split('.').length-b.split('.').length||a.localeCompare(b));ids.forEach((a,i)=>{index[a]=i;if(par(a))(children[par(a)]??=[]).push(a)});faculties=children.uba;layout=new URLSearchParams(location.search).get('layout')==='strata'?'strata':'constellation';$('layout').value=layout;
 scene=new THREE.Scene();camera=new THREE.PerspectiveCamera(45,1,.1,12000);camera.position.set(850,650,1000);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));$('world').prepend(renderer.domElement);controls=new OrbitControls(camera,renderer.domElement);controls.minDistance=4;controls.maxDistance=5000;controls.enableDamping=false;controls.addEventListener('change',invalidate);controls.addEventListener('start',()=>{flight=null;$('hover').hidden=true});
 nodes=new THREE.InstancedMesh(new THREE.SphereGeometry(1,8,6),fadeMaterial(new THREE.MeshBasicMaterial({transparent:true,depthWrite:false})),ids.length);nodes.geometry.setAttribute('focusOpacity',new THREE.InstancedBufferAttribute(new Float32Array(ids.length).fill(1),1));scene.add(nodes);lines=new THREE.LineSegments(new THREE.BufferGeometry(),fadeMaterial(new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.13,depthWrite:false})));scene.add(lines);highlight=new THREE.LineSegments(new THREE.BufferGeometry(),new THREE.LineBasicMaterial({color:'#dcad66',transparent:true,opacity:.9,depthTest:false}));highlight.renderOrder=2;scene.add(highlight);resize();theme();new ResizeObserver(resize).observe($('world'));dark.addEventListener('change',theme);
 renderer.domElement.addEventListener('pointerdown',e=>{pointerStart={x:e.clientX,y:e.clientY}});renderer.domElement.addEventListener('click',e=>{if(pointerStart&&Math.hypot(e.clientX-pointerStart.x,e.clientY-pointerStart.y)>5)return;const a=pick(e);if(a)inspect(a);else clearSelection()});renderer.domElement.addEventListener('dblclick',e=>{const a=pick(e);if(a)travel(a)});renderer.domElement.addEventListener('pointerleave',()=>$('hover').hidden=true);let hoverTime=0;renderer.domElement.addEventListener('pointermove',e=>{if(e.buttons||performance.now()-hoverTime<80)return;hoverTime=performance.now();const a=pick(e);$('hover').hidden=!a;renderer.domElement.style.cursor=a?'pointer':'grab';if(a){$('hover').textContent=name(a);$('hover').style.left=Math.max(4,Math.min(e.clientX+12,$('world').clientWidth-270))+'px';$('hover').style.top=Math.max(4,e.clientY-$('world').getBoundingClientRect().top-35)+'px'}});
 renderer.domElement.addEventListener('webglcontextlost',e=>{e.preventDefault();$('error').hidden=false;$('error').innerHTML='Se perdió la conexión gráfica. <button onclick="location.reload()">Recargar</button>'});ready=true;$('error').hidden=true;let a;try{a=decodeURIComponent(location.hash.slice(1))}catch{}travel(meta[a]?a:'uba',false);
 }catch(e){$('error').innerHTML=`${esc(e.message)}<br>Esta vista necesita WebGL.<br><a href="graph.html">Volver al Atlas 2D →</a>`;console.error(e)}}
$('reset').onclick=()=>{if(ready)travel('uba')};$('top').onclick=()=>{if(ready)flyTo(controls.target,camera.position.distanceTo(controls.target),new THREE.Vector3(0,1,.001))};$('orbit').onclick=()=>{if(ready)flyTo(controls.target,camera.position.distanceTo(controls.target),new THREE.Vector3(1,.65,1).normalize())};$('edges').onclick=()=>{if(!ready)return;lines.visible=!lines.visible;$('edges').setAttribute('aria-pressed',lines.visible);invalidate()};$('layout').onchange=e=>{if(!ready)return;layout=e.target.value;updateGeometry();travel(active)};
$('search').oninput=()=>{if(!ready)return;const q=normalize($('search').value.trim());if(!q){$('results').hidden=true;return}const matches=ids.filter(a=>normalize(name(a)+' '+a).includes(q)).slice(0,25);$('results').innerHTML=matches.length?matches.map(a=>`<button data-a="${esc(a)}">${esc(name(a))}<small>${esc(kinds[meta[a].k]||meta[a].k)} · ${esc(name(par(a))||'UBA')}</small></button>`).join(''):'<p style="padding:12px">Sin coincidencias.</p>';$('results').hidden=false;$('results').querySelectorAll('button').forEach(b=>b.onclick=()=>{travel(b.dataset.a);inspect(b.dataset.a);$('results').hidden=true;$('search').value=''})};$('search').onkeydown=e=>{if(e.key==='Enter')$('results').querySelector('button')?.click();if(e.key==='ArrowDown'){$('results').querySelector('button')?.focus();e.preventDefault()}};document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ready)clearSelection();$('results').hidden=true}});document.addEventListener('click',e=>{if(!e.target.closest('.search'))$('results').hidden=true});window.addEventListener('popstate',()=>{if(!ready)return;layout=new URLSearchParams(location.search).get('layout')==='strata'?'strata':'constellation';$('layout').value=layout;updateGeometry();let a;try{a=decodeURIComponent(location.hash.slice(1))}catch{}travel(meta[a]?a:'uba',false)});init();
</script>
