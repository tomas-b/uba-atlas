.dot{width:7px;height:7px;flex:none;border-radius:50%}.faculty .name{flex:1}.faculty .num{font-size:10px;color:var(--muted)}.rail-foot{border-top:1px solid var(--line);margin-top:22px;padding-top:17px;color:var(--muted);font-size:10px;line-height:1.8}.rail-foot b{color:var(--ink);font-size:19px;font-weight:400}.workspace{position:relative;display:flex;flex-direction:column;min-width:0;overflow:hidden}.top{padding:20px 26px 14px;flex:none;border-bottom:1px solid var(--line)}#crumb{display:flex;flex-wrap:wrap;align-items:center;gap:7px;min-height:19px;font-size:10px;color:var(--muted)}#crumb button{border:0;padding:0;border-radius:0;color:var(--muted);font-size:10px}h1{font-size:25px;letter-spacing:-1px;font-weight:500;margin:13px 0 8px}.context{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.context p{font-size:11px;color:var(--muted);margin:0;line-height:1.6;flex:1}.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:10px}.controls select{background:var(--panel);padding:7px;border:1px solid var(--line);border-radius:4px}.controls label{display:flex;gap:6px;align-items:center}.stage{flex:1;position:relative;overflow:hidden;min-height:220px}#map{display:block;width:100%;height:100%;touch-action:none}#map text{font-family:var(--font);fill:var(--ink)}.map-node{cursor:pointer}.map-node:focus{outline:2px solid var(--accent)}.map-link{fill:none;stroke:var(--line)}#board{position:absolute;inset:0;overflow:auto;padding:24px;display:flex;gap:18px;align-items:flex-start}#board[hidden]{display:none}.lane{width:270px;flex:0 0 270px}.lane-head{padding:0 0 14px;border-bottom:2px solid var(--accent);margin-bottom:15px}.lane-head small{color:var(--muted);font-size:10px}.lane-head h2{font-weight:500;font-size:14px;line-height:1.5;margin:6px 0}.lane-head p{font-size:11px;color:var(--muted);line-height:1.5}.card{display:block;text-align:left;width:100%;padding:14px;background:var(--panel);margin:0 0 10px;border-left:3px solid var(--line)}.card strong{font-size:12px;font-weight:500;line-height:1.5;display:block}.card small{color:var(--muted);font-size:10px;line-height:1.6;display:block;margin-top:8px}.card .tag{color:var(--accent)}.card.selected{outline:2px solid var(--accent)}.bottom{display:flex;align-items:center;gap:14px;justify-content:space-between;border-top:1px solid var(--line);padding:11px 20px;font-size:10px;color:var(--muted);flex-wrap:wrap;min-height:49px;background:var(--panel)}.legend{display:flex;gap:13px;flex-wrap:wrap}.legend span{white-space:nowrap}.legend i{display:inline-block;width:8px;height:8px;border:1.5px solid var(--muted);border-radius:50%;margin-right:5px}.legend .filled{background:var(--ready);border-color:var(--ready)}.legend .sealed{border-color:var(--sealed);border-style:dashed}.zoom{display:flex;gap:4px}.zoom button{padding:5px 10px;font-size:12px}.inspector{position:absolute;right:16px;top:15px;bottom:15px;width:330px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 14px 45px #0002;overflow:auto;padding:22px;z-index:4}.inspector[hidden]{display:none}.close{float:right;padding:2px 8px;font-size:20px;margin:-10px -10px 0 8px}.inspector h2{font-size:20px;letter-spacing:-.6px;font-weight:500;line-height:1.4;margin:12px 0}.inspector p{font:13px/1.7 system-ui,sans-serif;color:var(--muted)}.badges{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}.badge{font-size:9px;border:1px solid var(--line);padding:4px 6px;border-radius:3px}.inspector .primary{background:var(--ink);color:var(--paper);width:100%;margin:8px 0}.inspector section{border-top:1px solid var(--line);margin-top:18px;padding-top:16px}.inspector section h3{font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:400;color:var(--muted)}.inspector a{display:block;overflow-wrap:anywhere;font-size:11px;line-height:1.6;margin:8px 0}.mini-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:15px 0}.mini-stats b{display:block;font-size:22px;font-weight:400}.mini-stats sm @media(max-width:1050px){header{gap:12px;flex-wrap:wrap}.subtitle{display:none}.searchbox{width:220px}.layout{height:calc(100dvh - 65px);grid-template-columns:185px minmax(0,1fr)}nav button{min-width:auto}.rail{padding:18px 9px}.top{padding:16px 18px}.controls label span{display:none}}

<body>
<header><a class="brand" href="index.html">UBA <span>Atlas</span></a><span class="subtitle">El conocimiento, a distintas escalas</span><nav aria-label="Versiones del grafo"><button data-view="atlas" aria-pressed="true">01 Atlas</button><button data-view="territorios" aria-pressed="false">02 Territorios</button><button data-view="plan" aria-pressed="false">03 Plan</button><a id="space-link" href="graph-space.html" style="align-self:center;padding:8px 10px;white-space:nowrap;font-size:11px">04 Espacio ↗</a></nav><div class="searchbox"><input id="search" type="search" placeholder="Buscar en toda la UBA…" aria-label="Buscar facultades, carreras, materias o libros" autocomplete="off" aria-controls="results"><div id="results" hidden></div></div></header>
<div class="layout"><aside class="rail"><p class="eyebrow">La universidad</p><button class="all" id="home">↖ Todo el atlas</button><div id="faculties"></div><div class="rail-foot" id="totals">Leyendo el índice…</div></aside><main class="workspace"><div class="top"><div id="crumb"></div><h1 id="heading">El mapa completo</h1><div class="context"><p id="summary" aria-live="polite">Cargando las fuentes del atlas…</p><div class="controls"><label><span>Color</span><select id="color"><option value="faculty">Facultad</option><option value="coverage">Cobertura</option></select></label><label id="depth-control"><span>Detalle</span><select id="depth"><option value="1">1 nivel</option><option value="2" selected>2 niveles</option><option value="3">3 niveles</option><option value="4">Todo</option></select></label><button id="up" aria-label="Explorar el nivel superior">↑ Subir</button></div></div></div><div class="stage" id="stage"><svg id="map" aria-label="Grafo de la Universidad de Buenos Aires"></svg><div id="board" hidden></div><div class="notice" id="notice">Preparando el mapa…</div><aside class="inspector" id="inspector" aria-label="Detalle del nodo" hidden></aside><div id="tooltip" hidden></div></div><footer class="bottom"><div class="legend"><span><i class="filled"></i>Con página</span><span><i></i>En el índice</span><span><i class="sealed"></i>Sellado</span><span>◇ Con auditoría</span></div><span class="help" id="hint">Arrastrá para mover · rueda para acercar · doble clic para explorar</span><div class="zoom" id="zoom-controls"><button id="minus" aria-label="Alejar">−</button><button id="fit">Ajustar</button><button id="plus" aria-label="Acercar">+</button></div></footer></main></div>
<script>
const $=id=>document.getElementById(id), fmt=n=>Number(n||0).toLocaleString('es-AR');
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KIND={institution:'Institución',faculty:'Facultad',cbc:'CBC',cbcarea:'Área CBC',career:'Carrera',course:'Materia',unit:'Unidad',book:'Libro'};
const PALETTE=['#b58b3d','#a46c58','#7c8f54','#749771','#9f8645','#5b94a0','#969452','#9d7094','#608ab2','#ab776c','#769986','#a96868','#a8875e','#8888b0'];
let META={},GROUPS={},CHILDREN={},FACULTIES=[],root='uba',view='atlas',selected=null,depth=2,mode='faculty',svg,layer,zoom,fitTransform,layoutNodes=[],lastSize='',queryTimer;
const normalize=s=>String(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const parent=a=>META[a]?.p||a.split('.').slice(0,-1).join('.');
const label=a=>META[a]?.l||a.split('.').pop();
const color=a=>{const m=META[a];if(m.s)return 'var(--sealed)';if(mode==='coverage')return m.d?'var(--ready)':'var(--muted)';return PALETTE[Math.max(0,FACULTIES.indexOf(m.f))%PALETTE.length]};
const children=a=>CHILDREN[a]||[];
function hierarchy(a,limit=Infinity,level=0){return {a,children:level<limit?children(a).map(c=>hierarchy(c,limit,level+1)):undefined}}
function readURL(){const p=new URLSearchParams(location.search);view=['atlas','territorios','plan'].includes(p.get('view'))?p.get('view'):'atlas';mode=p.get('color')==='coverage'?'coverage':'faculty';depth=[1,2,3,4].includes(+p.get('depth'))?+p.get('depth'):2;let a;try{a=decodeURIComponent(location.hash.slice(1))}catch{}root=META[a]?a:'uba'}
function saveURL(){const u=new URL(location.href);u.searchParams.set('view',view);u.searchParams.set('depth',depth);u.searchParams.set('color',mode);u.hash=root;history.pushState(null,'',u)}
function focus(a){if(!META[a])return;root=a;selected=null;$('inspector').hidden=true;$('tooltip').hidden=true;$('results').hidden=true;saveURL();render()}
function status(m){return m.s?'Sellado':m.d?'Con página propia':'Referencia en el índice'}
function safeURL(value){try{const u=new URL(value,location.href);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}}
function inspect(a){
 selected=a;const m=META[a],cs=m.counts||{},has=children(a).length;const reference=META[m.referenceParent||parent(a)];const source=m.source||reference?.source;const sourceUrl=safeURL(source?.url);const panel=$('inspector');
 panel.innerHTML=`<button class="close" aria-label="Cerrar detalle">×</button><p class="eyebrow">${escape(KIND[m.k]||m.k)}</p><h2>${escape(m.l)}</h2><div class="badges"><span class="badge">${status(m)}</span>${m.g?`<span class="badge">${escape(m.g)} · nivel declarado</span>`:''}${m.v?'<span class="badge">◇ Con auditoría</span>':''}</div>${m.role?`<p>${escape(m.role)}</p>`:''}${m.description?`<p>${escape(m.description)}</p>`:''}${!m.d?`<p>Esta entrada está citada en ${escape(reference?.l||'su nodo padre')}. Todavía no tiene una página de contenido propia.</p>`:''}${has?`<div class="mini-stats"><div><b>${fmt(cs.courses)}</b><small>materias</small></div><div><b>${fmt(cs.units)}</b><small>unidades</small></div><div><b>${fmt(cs.books)}</b><small>libros</small></div></div><button class="primary" id="explore">Explorar esta rama ↗</button>`:''}${m.d?`<a href="index.html#${encodeURIComponent(a)}" target="_blank" rel="noopener">Abrir la página del nodo ↗</a>`:''}${source?`<section><h3>${m.source?'Fuente del nodo':'Fuente del nodo que cita esta entrada'}</h3>${sourceUrl?`<a href="${escape(sourceUrl)}" target="_blank" rel="noopener">${escape(source.label||'Ver documento fuente')} ↗</a>`:`<p>${escape(source.label||'Fuente registrada sin enlace')}</p>`}</section>`:''}${m.audit?`<section><h3>Verificación adversarial</h3><p>Informe registrado: <strong>${escape({clean:'limpio',errors:'errores detectados',fabrication:'fabricación detectada',unverifiable:'no verificable'}[m.audit.verdict]||m.audit.verdict)}</strong>${m.audit.date?' · '+escape(m.audit.date):''}. Es el resultado del informe; no una nueva evaluación del contenido actual.</p><a href="index.html#${encodeURIComponent(a)}" target="_blank" rel="noopener">Leer la auditoría en el nodo ↗</a></section>`:''}${has?`<section><h3>Entradas directas · ${fmt(has)}</h3>${children(a).slice(0,80).map(c=>`<button class="child" data-child="${escape(c)}">${escape(label(c))} ${children(c).length?'↗':'→'}</button>`).join('')}${has>80?'<p>El resto de las entradas está disponible en la vista Plan.</p>':''}</section>`:''}`;
 panel.hidden=false;panel.querySelector('.close').onclick=()=>{panel.hidden=true;selected=null;highlight()};if(has)$('explore').onclick=()=>focus(a);panel.querySelectorAll('[data-child]').forEach(b=>b.onclick=()=>{children(b.dataset.child).length?focus(b.dataset.child):inspect(b.dataset.child)});highlight();
}
function highlight(){if(layer)layer.selectAll('.map-node').attr('data-selected',d=>d.data.a===selected?'true':null).select('.node-mark').attr('stroke-width',d=>d.data.a===selected?3:1.3);document.querySelectorAll('.card').forEach(b=>b.classList.toggle('selected',b.dataset.a===selected))}
function tooltip(event,d){const tip=$('tooltip');tip.textContent=label(d.data.a)+' · '+status(META[d.data.a]);tip.hidden=false;const box=$('stage').getBoundingClientRect();tip.style.left=Math.max(5,Math.min(event.clientX-box.left+14,box.width-290))+'px';tip.style.top=Math.max(5,Math.min(event.clientY-box.top+12,box.height-70))+'px'}
function bindNodes(selection){selection.on('click',(e,d)=>{e.stopPropagation();inspect(d.data.a)}).on('dblclick',(e,d)=>{e.preventDefault();e.stopPropagation();if(children(d.data.a).length)focus(d.data.a)}).on('pointermove',tooltip).on('pointerleave',()=>$('tooltip').hidden=true)}
function drawAtlas(w,h){
 const tree=d3.hierarchy(hierarchy(root,depth===4?Infinity:depth));d3.tree().size([2*Math.PI,Math.max(1,tree.height)*190]).separation((a,b)=>(a.parent===b.parent?1:1.6)/Math.max(1,a.depth))(tree);
 tree.each(d=>{d.px=Math.sin(d.x)*d.y;d.py=-Math.cos(d.x)*d.y});layoutNodes=tree.descendants();
 for(let i=1;i<=tree.height;i++)layer.append('circle').attr('r',i*190).attr('fill','none').attr('stroke','var(--line)').attr('stroke-dasharray','2 9').attr('opacity',.5);
 layer.selectAll('.map-link').data(tree.links()).join('path').attr('class','map-link').attr('d',d3.linkRadial().angle(d=>d.x).radius(d=>d.y)).attr('stroke-width',1.2);
 const ns=layer.selectAll('.map-node').data(layoutNodes).join('g').attr('class','map-node').attr('transform',d=>`translate(${d.px},${d.py})`);
 ns.append('circle').attr('class','node-mark').attr('r',d=>d.depth===0?12:d.depth===1?7:4).attr('fill',d=>META[d.data.a].d?color(d.data.a):'var(--paper)').attr('stroke',d=>color(d.data.a)).attr('stroke-width',1.3).attr('stroke-dasharray',d=>META[d.data.a].s?'3 2':null);
 ns.append('text').attr('x',d=>d.depth===0?18:Math.sin(d.x)>=0?12:-12).attr('dy','.35em').attr('text-anchor',d=>d.depth===0||Math.sin(d.x)>=0?'start':'end').attr('font-size',d=>d.depth<2?13:11).attr('font-weight',d=>d.depth<2?600:400).text(d=>{const s=label(d.data.a);return s.length>34?s.slice(0,32)+'…':s}).attr('paint-order','stroke').attr('stroke','var(--paper)').attr('stroke-width',4).attr('stroke-linejoin','round');
 ns.filter(d=>META[d.data.a].v).append('text').attr('x',-3).attr('y',-12).attr('font-size',10).text('◇');bindNodes(ns);
 const radius=Math.max(140,tree.height*190);const k=Math.min(w/(radius*2+360),h/(radius*2+110),1.25);fitTransform=d3.zoomIdentity.translate(w/2,h/2).scale(k);svg.call(zoom.transform,fitTransform);
}
function drawTerritories(w,h){
 const tree=d3.hierarchy(hierarchy(root)).sum(d=>!d.children?.length?1:0).sort((a,b)=>b.value-a.value||a.data.a.localeCompare(b.data.a));d3.pack().size([1000,1000]).padding(12)(tree);layoutNodes=tree.descendants().filter(d=>depth===4||d.depth<=depth);
 const ns=layer.selectAll('.map-node').data(layoutNodes).join('g').attr('class','map-node').attr('transform',d=>`translate(${d.x},${d.y})`);
 ns.append('circle').attr('class','node-mark').attr('r',d=>Math.max(.4,d.r)).attr('fill',d=>d.depth?color(d.data.a):'none').attr('fill-opacity',d=>d.children?.length ? .06 : .16).attr('stroke',d=>d.depth?color(d.data.a):'var(--line)').attr('stroke-opacity',.65).attr('stroke-width',1.3).attr('stroke-dasharray',d=>META[d.data.a].s?'5 4':null);
 ns.append('text').attr('text-anchor','middle').attr('y',d=>d.children?.length?-d.r+20:4).attr('font-size',13).attr('paint-order','stroke').attr('stroke','var(--paper)').attr('stroke-width',3).text(d=>{if(d.r<28||d.depth===0)return '';const s=label(d.data.a),max=Math.max(6,Math.floor(d.r/4));return s.length>max?s.slice(0,max-1)+'…':s});bindNodes(ns);
 const k=Math.min((w-50)/1000,(h-35)/1000);fitTransform=d3.zoomIdentity.translate((w-1000*k)/2,(h-1000*k)/2).scale(k);svg.call(zoom.transform,fitTransform);
}
function drawPlan(){const gs=GROUPS[root]?.length?GROUPS[root]:[{label:'Entradas del índice',title:'',children:children(root)}];$('board').innerHTML=gs.map((g,i)=>`<section class="lane"><div class="lane-head"><small>${String(i+1).padStart(2,'0')} / ${fmt(g.children.length)} entradas</small><h2>${escape(g.label)}</h2>${g.title&&g.title!==g.label?`<p>${escape(g.title)}</p>`:''}${g.note?`<p>${escape(g.note)}</p>`:''}</div>${g.children.map(a=>{const m=META[a];return `<button class="card" data-a="${escape(a)}" style="border-left-color:${color(a)}"><strong>${escape(m.l)}</strong>${m.tag?`<small class="tag">${escape(m.tag)}</small>`:''}${m.role?`<small>${escape(m.role)}</small>`:''}<small>${status(m)}${m.v?' · ◇ Auditoría':''}${children(a).length?' · '+fmt(children(a).length)+' entradas ↗':''}</small></button>`}).join('')}</section>`).join('');$('board').querySelectorAll('.card').forEach(b=>{b.onclick=()=>inspect(b.dataset.a);b.ondblclick=()=>{if(children(b.dataset.a).length)focus(b.dataset.a)}})}
function render(){
 const m=META[root],cs=m.counts||{};$('space-link').href='graph-space.html#'+encodeURIComponent(root);document.title=label(root)+' · '+({atlas:'Atlas',territorios:'Territorios',plan:'Plan'}[view])+' · UBA';$('heading').textContent=root==='uba'?'El mapa completo':m.l;$('summary').textContent=`${fmt(cs.addresses)} direcciones · ${fmt(cs.pages)} páginas · ${fmt(cs.courses)} materias en esta rama`;$('color').value=mode;$('depth').value=depth;$('up').disabled=root==='uba';
 let chain=[],a=root;while(a&&META[a]){chain.unshift(a);a=parent(a)}$('crumb').innerHTML=chain.map((a,i)=>`<button data-root="${escape(a)}">${escape(i===0?'UBA':label(a))}</button>`).join('<span> / </span>');$('crumb').querySelectorAll('button').forEach(b=>b.onclick=()=>focus(b.dataset.root));document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.view===view));
 $('map').style.display=view==='plan'?'none':'block';$('board').hidden=view!=='plan';$('depth-control').hidden=view==='plan';$('zoom-controls').hidden=view==='plan';$('notice').hidden=true;$('hint').textContent=view==='territorios'?'Área según hojas del índice · doble clic para entrar':view==='plan'?'Grupos y orden del nodo fuente · seleccioná una entrada':'Arrastrá para mover · rueda para acercar · doble clic para explorar';
 if(view==='plan'){drawPlan();if(!children(root).length){$('notice').textContent='Esta entrada no tiene más subdivisiones. Seleccionala para ver su fuente.';$('notice').hidden=false;inspect(root)}return}
 layer.selectAll('*').remove();const {width:w,height:h}=$('stage').getBoundingClientRect();if(w<1||h<1)return;view==='atlas'?drawAtlas(w,h):drawTerritories(w,h);highlight();
}
function search(){const q=normalize($('search').value.trim());if(!q){$('results').hidden=true;return}const matches=Object.keys(META).filter(a=>normalize(META[a].l+' '+a).includes(q)).sort((a,b)=>(normalize(META[a].l).startsWith(q)?0:1)-(normalize(META[b].l).startsWith(q)?0:1)||a.split('.').length-b.split('.').length).slice(0,25);$('results').innerHTML=matches.length?matches.map(a=>`<button data-found="${escape(a)}">${escape(label(a))}<small>${escape(KIND[META[a].k]||META[a].k)} · ${escape(label(parent(a)))} · ${status(META[a])}</small></button>`).join(''):'<p style="padding:12px">No hay coincidencias en el índice.</p>';$('results').hidden=false;$('results').querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=b.dataset.found;focus(children(a).length?a:parent(a));inspect(a);$('search').value=''});}
async function init(){
 try{if(typeof d3==='undefined')throw Error('No se pudo cargar D3.');const response=await fetch('graph-data.json');if(!response.ok)throw Error('No se pudo cargar el índice.');const data=await response.json();META=data.meta;GROUPS=data.groups||{};for(const a of Object.keys(META)){META[a].p??=a==='uba'?null:a.split('.').slice(0,-1).join('.');META[a].f??=a.split('.').slice(0,2).join('.');if(META[a].p)(CHILDREN[META[a].p]??=[]).push(a)}for(const list of Object.values(CHILDREN))list.sort((a,b)=>(META[a].group??999)-(META[b].group??999)||(META[a].order??999)-(META[b].order??999)||label(a).localeCompare(label(b),'es'));FACULTIES=children('uba');
 $('faculties').innerHTML=FACULTIES.map((a,i)=>`<button class="faculty" data-faculty="${escape(a)}"><span class="dot" style="background:${PALETTE[i%PALETTE.length]}"></span><span class="name">${escape(label(a))}</span><span class="num">${fmt(META[a].counts?.courses)}</span></button>`).join('');$('faculties').querySelectorAll('button').forEach(b=>b.onclick=()=>focus(b.dataset.faculty));$('totals').innerHTML=`<b>${fmt(Object.keys(META).length)}</b> direcciones<br>${fmt(Object.values(META).filter(m=>m.d).length)} páginas · ${fmt(Object.values(META).filter(m=>m.v).length)} auditorías<br><br>Los números de cada facultad cuentan materias dentro de sus carreras, incluidas sus distintas apariciones.`;
 svg=d3.select('#map');layer=svg.append('g');zoom=d3.zoom().scaleExtent([.04,12]).on('zoom',e=>{const k=e.transform.k;layer.attr('transform',e.transform);layer.selectAll('.map-node text').attr('font-size',d=>(d.depth<2?13:11)/k).attr('stroke-width',3/k);if(view==='atlas'){layer.selectAll('.map-node text').attr('display',d=>d.depth<2||k>.7?null:'none')}else{layer.selectAll('.map-node text').attr('display',d=>d.depth&&d.r*k>38?null:'none').attr('y',d=>d.children?.length?-d.r+18/k:4/k).text(d=>{const s=label(d.data.a),n=Math.max(5,Math.floor(d.r*k/4));return s.length>n?s.slice(0,n-1)+'…':s})}});svg.call(zoom).on('dblclick.zoom',null);readURL();render();new ResizeObserver(()=>{const r=$('stage').getBoundingClientRect(),s=Math.round(r.width)+':'+Math.round(r.height);if(s!==lastSize){lastSize=s;render()}}).observe($('stage'));
 }catch(e){$('notice').hidden=false;$('notice').innerHTML=`${escape(e.message)}<br><button onclick="location.reload()">Volver a intentar</button>`;$('summary').textContent='El mapa no pudo cargarse.';console.error(e)}
}
new ResizeObserver(()=>document.documentElement.style.setProperty('--header-height',document.querySelector('header').getBoundingClientRect().height+'px')).observe(document.querySelector('header'));
$('home').onclick=()=>focus('uba');$('up').onclick=()=>{if(parent(root))focus(parent(root))};document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{view=b.dataset.view;$('inspector').hidden=true;saveURL();render()});$('color').onchange=e=>{mode=e.target.value;saveURL();render()};$('depth').onchange=e=>{depth=+e.target.value;saveURL();render()};$('plus').onclick=()=>svg.transition().duration(200).call(zoom.scaleBy,1.5);$('minus').onclick=()=>svg.transition().duration(200).call(zoom.scaleBy,1/1.5);$('fit').onclick=()=>svg.transition().duration(250).call(zoom.transform,fitTransform);$('search').oninput=()=>{clearTimeout(queryTimer);queryTimer=setTimeout(search,120)};$('search').onkeydown=e=>{if(e.key==='ArrowDown'){$('results').querySelector('button')?.focus();e.preventDefault()}if(e.key==='Enter')$('results').querySelector('button')?.click()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('results').hidden=true;$('inspector').hidden=true;$('tooltip').hidden=true}if(e.key==='/'&&e.target.tagName!=='INPUT'){e.preventDefault();$('search').focus()}});document.addEventListener('click',e=>{if(!e.target.closest('.searchbox'))$('results').hidden=true});window.addEventListener('popstate',()=>{readURL();$('inspector').hidden=true;render()});window.addEventListener('hashchange',()=>{readURL();$('inspector').hidden=true;render()});init();
</script>
</body>
